import java.awt.*
import java.awt.image.BufferedImage
import javax.imageio.ImageIO
import java.io.File

task generateTextures {
    doLast {
        generateAudioPlayerBlockTexture("src/main/resources/assets/pearphone/textures/block/audio_player.png")
        generatePearPhoneTexture("src/main/resources/assets/pearphone/textures/item/pearphone.png")
        generateGuiTexture("src/main/resources/assets/pearphone/textures/gui/audio_player_gui.png")
        println("✓ All textures generated successfully!")
    }
}

def generateAudioPlayerBlockTexture(String outputPath) {
    def image = new BufferedImage(16, 16, BufferedImage.TYPE_INT_ARGB)
    
    def g2d = image.createGraphics()
    g2d.setColor(new Color(80, 80, 80))
    g2d.fillRect(0, 0, 16, 16)
    
    g2d.setColor(new Color(40, 40, 40))
    g2d.setStroke(new BasicStroke(1.0f))
    g2d.drawRect(1, 1, 14, 14)
    
    g2d.setColor(new Color(200, 200, 200))
    int[] xPoints = [6, 6, 10]
    int[] yPoints = [4, 12, 8]
    g2d.fillPolygon(xPoints, yPoints, 3)
    
    g2d.setColor(new Color(150, 200, 255))
    g2d.setStroke(new BasicStroke(1.0f))
    g2d.drawArc(11, 6, 3, 3, 315, 90)
    g2d.drawArc(12, 5, 4, 5, 315, 90)
    
    g2d.dispose()
    
    def outputFile = new File(outputPath)
    outputFile.getParentFile().mkdirs()
    ImageIO.write(image, "PNG", outputFile)
    println("Generated: ${outputPath}")
}

def generatePearPhoneTexture(String outputPath) {
    def image = new BufferedImage(16, 16, BufferedImage.TYPE_INT_ARGB)
    def g2d = image.createGraphics()
    
    g2d.setColor(new Color(180, 180, 180))
    g2d.fillRoundRect(2, 2, 12, 12, 2, 2)
    
    g2d.setColor(new Color(100, 100, 100))
    g2d.setStroke(new BasicStroke(1.0f))
    g2d.drawRoundRect(2, 2, 12, 12, 2, 2)
    
    g2d.setColor(new Color(50, 50, 50))
    g2d.fillRect(4, 4, 8, 5)
    
    g2d.setColor(new Color(100, 100, 100))
    g2d.drawRect(4, 4, 8, 5)
    
    g2d.setColor(new Color(100, 150, 255))
    g2d.fillOval(5, 11, 2, 2)
    g2d.fillOval(7, 11, 2, 2)
    g2d.fillOval(9, 11, 2, 2)
    
    g2d.setColor(new Color(0, 255, 0))
    g2d.fillOval(13, 3, 2, 2)
    
    g2d.dispose()
    
    def outputFile = new File(outputPath)
    outputFile.getParentFile().mkdirs()
    ImageIO.write(image, "PNG", outputFile)
    println("Generated: ${outputPath}")
}

def generateGuiTexture(String outputPath) {
    def image = new BufferedImage(256, 220, BufferedImage.TYPE_INT_ARGB)
    def g2d = image.createGraphics()
    
    def gradient = new GradientPaint(
            0, 0, new Color(60, 60, 60),
            0, 220, new Color(40, 40, 40)
    )
    g2d.setPaint(gradient)
    g2d.fillRect(0, 0, 256, 220)
    
    g2d.setColor(new Color(100, 100, 100))
    g2d.setStroke(new BasicStroke(2.0f))
    g2d.drawRect(1, 1, 254, 218)
    
    g2d.setColor(new Color(80, 80, 80))
    g2d.drawRect(2, 2, 252, 216)
    
    g2d.dispose()
    
    def outputFile = new File(outputPath)
    outputFile.getParentFile().mkdirs()
    ImageIO.write(image, "PNG", outputFile)
    println("Generated: ${outputPath}")
}
